conda_build_tool: rattler-build
build_platform:
  linux_ppc64le: linux_64
provider:
  linux_aarch64: default
  linux_ppc64le: default
# weston links libpam.so.0 and relies on the SYSTEM pam at runtime (see
# missing_dso_allowlist in the recipe) because conda-forge ships only the
# link-time pam-stubs, no real pam. Under emulation the x86_64 build container
# has no aarch64/ppc64le system libpam, so `weston --version` dies with
# "error while loading shared libraries: libpam.so.0" (exit 127) even though
# the cross build itself is fine. Test natively only; linux-64 still runs the
# full suite.
test: native
github:
  branch_name: main
  tooling_branch_name: main
conda_build:
  error_overlinking: true
conda_forge_output_validation: true
